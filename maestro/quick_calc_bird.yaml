# Maestro E2E flow (§11.10 спецификации, Task 23 / Plan 2).
#
# Сценарий: Quick Calculator для птицы → выбор подкатегории «Корелла» (Cockatiel)
# из BirdType dropdown → расчёт. Покрывает расширение Plan 2 Tasks 7/16 (scalar-ratio
# формула AAV + species-aware subcategory selector с 10 типами птиц).
#
# Запуск:
#   maestro test maestro/quick_calc_bird.yaml
#
# Локаль: русские строки (default по §6).
#
# Эталонное значение ЧГ (cockatiel 5 лет ≈ 26.7 ЧГ по §4.8) не ассертится: дефолтная
# дата = «1 год назад», вождение DatePicker к точной дате хрупко (см. комментарий в
# quick_calc_rabbit.yaml). Точные значения формулы — в BirdAgeCalculatorTest.
appId: app.pawclock.debug
---
- clearState
- launchApp

- tapOn: "Быстрый расчёт"
- assertVisible: "Быстрый расчёт"

# Выбрать вид «Птица» (9-й chip в FlowRow — может быть под фолдом, поэтому scroll).
- scrollUntilVisible:
    element:
      text: "Птица"
    direction: DOWN
    timeout: 20000
- tapOn: "Птица"

# Subcategory dropdown для птицы (BirdType). «Корелла» = bird_type_cockatiel.
- scrollUntilVisible:
    element:
      text: "Корелла"
    direction: DOWN
    timeout: 20000
- assertVisible: "Корелла"
- tapOn: "Корелла"

# Указать дату рождения (дефолт = «1 год назад»).
- scrollUntilVisible:
    element:
      id: "quick_calc_birth_date_field"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "quick_calc_birth_date_field"
- tapOn: "ОК"

- tapOn:
    id: "quick_calc_calculate_fab"

- assertVisible: "В человеческих годах"
