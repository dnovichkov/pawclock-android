# Maestro E2E flow (§11.10 спецификации, Task 23 / Plan 2).
#
# Сценарий: Quick Calculator для лошади → выбор подкатегории Light horse
# («Верховая») → расчёт. Покрывает расширение Plan 2 Tasks 9/16 (3-фазная формула
# AAEP + HorseType subcategory selector).
#
# Запуск:
#   maestro test maestro/quick_calc_horse.yaml
#
# Локаль: английские селекторы — эмулятор CI работает в en-US, values-en
# перекрывает default (ru). См. комментарий в create_first_pet.yaml.
#
# Эталонное значение ЧГ (лошадь 10 лет = 35.5 ЧГ по §4.10) не ассертится: дефолтная
# дата = «1 год назад» (лошадь 1 год = 6.5 ЧГ), вождение DatePicker к точной дате
# хрупко (см. комментарий в quick_calc_rabbit.yaml). Точные значения формулы —
# в HorseAgeCalculatorTest.
appId: app.pawclock.debug
---
- clearState
- launchApp

- tapOn: "Quick calculator"
- assertVisible: "Quick calculator"

# Выбрать вид Horse (11-й chip в FlowRow — почти наверняка под фолдом, scroll).
- scrollUntilVisible:
    element:
      text: "Horse"
    direction: DOWN
    timeout: 20000
- tapOn: "Horse"

# Subcategory dropdown для лошади (HorseType). Light horse = horse_type_light_horse.
- scrollUntilVisible:
    element:
      text: "Light horse"
    direction: DOWN
    timeout: 20000
- assertVisible: "Light horse"
- tapOn: "Light horse"

# Указать дату рождения (дефолт = «1 год назад»).
- scrollUntilVisible:
    element:
      id: "quick_calc_birth_date_field"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "quick_calc_birth_date_field"
- tapOn: "OK"

- tapOn:
    id: "quick_calc_calculate_fab"

- assertVisible: "In human years"
